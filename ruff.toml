line-length = 120
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",  # long lines: mostly user-facing Telegram strings and URLs
    "E741",  # ambiguous single-char names: fine in tight parsing code
]

[lint.per-file-ignores]
# handler-registration side-effect imports
"telegram_logic/commands/__init__.py" = ["F401"]
"firebase_db/users.py" = ["F401"]      # DELETE_FIELD kept available by contract
# DL package re-exports
"*DL/__init__.py" = ["F401"]
