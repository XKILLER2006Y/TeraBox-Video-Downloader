[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --ignore=tests/test_features2.py --ignore=tests/test_features2_appendix.py --ignore=tests/test_new_features.py --ignore=tests/test_flaresolver.py --ignore=tests/test_streaming_diag.py
