services:
  telegram-bot:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    image: telegram-bot:latest
    container_name: telegram-bot
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen(f'http://localhost:{os.environ.get(\"PORT\",\"3000\")}/ping')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  storage_data: